<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VITAPROOF Gateway | Compute Node Auth</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #111827;
      --border: #1f2937;
      --accent: #10b981;
      --text: #f9fafb;
      --muted: #9ca3af;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 1.5rem; margin-top: 0; color: var(--text); letter-spacing: -0.025em; }
    p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
    .status-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #1f2937;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .status-badge.active { background: rgba(16, 185, 129, 0.15); color: var(--accent); }
    button {
      width: 100%;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
    pre {
      background: #030712;
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 6px;
      font-size: 0.75rem;
      overflow-x: auto;
      color: #34d399;
      margin-top: 1.5rem;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="container">
  <div id="badge" class="status-badge">GATEWAY OFFLINE</div>
  <h1>VITAPROOF Gateway</h1>
  <p>Authenticate via Sign-In With Solana (SIWS) to request AVX2 compute execution session keys.</p>

  <button id="authBtn" onclick="handshake()">Connect & Authenticate Phantom</button>

  <pre id="output" style="display:none;"></pre>
</div>

<script>
  async function handshake() {
    const btn = document.getElementById('authBtn');
    const badge = document.getElementById('badge');
    const output = document.getElementById('output');

    try {
      if (!window.solana || !window.solana.isPhantom) {
        alert('Phantom wallet required.');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Signing Message...';

      // 1. Connect Phantom
      const resp = await window.solana.connect();
      const publicKeyStr = resp.publicKey.toString();

      // 2. Build SIWS Message
      const domain = window.location.hostname;
      const nonce = crypto.randomUUID();
      const issuedAt = new Date().toISOString();
      const messageText = `${domain} wants you to sign in with your Solana account:\n${publicKeyStr}\n\nAuthenticate VITAPROOF Gateway Node Access.\n\nNonce: ${nonce}\nIssued At: ${issuedAt}`;

      // 3. Obtain Signature
      const messageBytes = new TextEncoder().encode(messageText);
      const { signature } = await window.solana.signMessage(messageBytes, 'utf8');

      btn.innerText = 'Verifying Handshake...';

      // 4. Submit to Cloud Function API
      const res = await fetch('/api/v1/auth/siws', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          publicKey: publicKeyStr,
          signature: Array.from(signature),
          message: messageText
        })
      });

      const data = await res.json();

      if (res.ok) {
        badge.innerText = 'AUTHENTICATED';
        badge.classList.add('active');
        btn.innerText = 'Node Connected';
        output.style.display = 'block';
        output.innerText = JSON.stringify(data, null, 2);
        sessionStorage.setItem('vitaproof_jwt', data.sessionToken);
      } else {
        throw new Error(data.error || 'Verification failed');
      }
    } catch (err) {
      alert('Handshake Failed: ' + err.message);
      btn.disabled = false;
      btn.innerText = 'Connect & Authenticate Phantom';
    }
  }
</script>

</body>
</html>
