[package]
name = "beth_vault"
version = "0.1.0"
edition = "2021"

[lib]
name = "beth_vault"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[dependencies]
solana-program = "2.1.0"
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
borsh = "1.5.1"
borsh-derive = "1.5.1"
zeroize = "1.8"
