version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: vitaproof-redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data

  gateway:
    build: .
    container_name: vitaproof-gateway
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - PORT=8080
      - GRPC_PORT=50051
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always

volumes:
  redis_data:
